name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets dependabot-typegen.yml re-run CI after pushing regenerated types.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm run format:check

      # Fails when worker-configuration.d.ts no longer matches wrangler.jsonc
      # or the installed workerd runtime. Fix with `pnpm cf-typegen`.
      - run: pnpm run cf-typegen:check

      - run: pnpm run typecheck

      - run: pnpm run test
